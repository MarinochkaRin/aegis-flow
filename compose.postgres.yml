# Development only. Do not reuse these credentials in production.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aegis_flow
      POSTGRES_USER: aegis_flow
      POSTGRES_PASSWORD: aegis_flow_dev_only
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - aegis_flow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aegis_flow -d aegis_flow"]
      interval: 2s
      timeout: 2s
      retries: 20
volumes:
  aegis_flow_pgdata:
